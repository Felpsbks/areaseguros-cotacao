        setS((p) => ({ ...p, cep: f, ...(completo ? {} : { status: "idle", bairro: "", cidade: "", uf: "", endereco: "" }) }));
        if (completo) buscar(f);
      };
      const textoCompleto = () => s.endereco + (s.numero ? `, nº ${s.numero}` : "") + (s.complemento ? ` - ${s.complemento}` : "");
      return { ...s, atualizar, buscar, mudarCep, textoCompleto, reset: () => setS(ENDERECO_VAZIO) };
    }

    // Detecta a borda "passou de falso para verdadeiro" (ex.: campo acabou de ser preenchido).
    function useJustBecameTrue(condition, duration = 700) {
      const [flash, setFlash] = useState(false);
      const prevRef = useRef(false);
      React.useEffect(() => {
        if (condition && !prevRef.current) {
          setFlash(true);
          const t = setTimeout(() => setFlash(false), duration);
          prevRef.current = condition;
          return () => clearTimeout(t);
        }
        prevRef.current = condition;
      }, [condition]);
      return flash;
    }

    function Campo({ label, error, children, opcional, dica, className = "", adorno }) {

      const idErro = `${id}-erro`;

      return (
        <div className={className}>

    function UploadField({ label, description, uploads, id, opcional, error }) {
      const [aviso, setAviso] = useState("");
      const { items, add, remove } = uploads;
      const handleChange = (e) => {
        const file = e.target.files?.[0];
        e.target.value = "";
        if (!file) return;
        if (!file.type.startsWith("image/")) { setAviso("Envie uma foto ou um print (imagem)."); return; }

        setAviso("");
        const reader = new FileReader();
        reader.onload = (ev) => add(file, ev.target.result);
        reader.readAsDataURL(file);

    function PlacaConsulta({ placa, onPlaca, status, onConsultar, veiculo, versoes = [], onVersao, confirmada, onConfirmar, onCorrigir, onManual, error }) {

    // Fica no topo do cartão do formulário (antes era um cartão separado).
    function Stepper({ etapas, etapaAtual, onIr, etapasVisitadas }) {

          <h2 className="font-display text-[1.9rem] sm:text-4xl font-semibold text-gray-900 mt-3 leading-tight">Antes de cotar</h2>
          <div className="cartao mt-6 px-5 sm:px-6 divide-y divide-[#ece8df]">
            {itens.map(([pergunta, resposta]) => (
              <details key={pergunta} className="py-4">
                <summary className="flex items-center justify-between gap-4 font-semibold text-gray-900 text-[15px]">
                  {pergunta}
                  <span className="mais w-7 h-7 rounded-full bg-creme ring-1 ring-gold/30 text-gold-dark flex items-center justify-center flex-shrink-0 text-lg leading-none" aria-hidden="true">+</span>
                </summary>
                <p className="text-sm text-gray-600 leading-relaxed mt-2.5 pr-10">{resposta}</p>
              </details>
            ))}
          </div>
          <p className="text-sm text-gray-600 mt-5">Ficou alguma dúvida? <a href={`https://wa.me/${WHATSAPP_NUMBER}`} target="_blank" rel="noopener noreferrer" className="font-semibold text-navy underline underline-offset-2 hover:text-gold-dark">Fale com a gente no WhatsApp</a>.</p>
        </section>
      );
    }

    function Rodape() {
      const titulo = "text-gold text-[11px] font-semibold uppercase tracking-[.18em] mb-3";
      return (
        <footer className="bg-navy text-gray-400 border-t border-gold/25">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 py-12 grid gap-9 sm:grid-cols-3">
            <div>
              <img src="/logo-cassiano.webp" alt="Cassiano Corretora" width="1089" height="326" className="logo-mk h-14 w-auto" loading="lazy" />
              <p className="font-display italic text-lg text-gold-light mt-4">Proteção para o que realmente importa.</p>
            </div>
            <div>
              <h2 className={titulo}>Atendimento</h2>
              <a href={`https://wa.me/${WHATSAPP_NUMBER}`} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2 text-sm hover:text-white transition-colors">
                <WhatsAppIcon className="w-4 h-4 text-whatsapp" /> {WHATSAPP_EXIBICAO}

              <h2 className={titulo}>Links</h2>

          {/* PENDENTE (dono): incluir CNPJ e registro SUSEP aqui — é o maior sinal de confiança para quem não conhece a corretora. */}
          <div className="border-t border-white/10">
            <p className="max-w-7xl mx-auto px-4 sm:px-6 py-5 text-xs text-gray-500">© {ANO_ATUAL} Cassiano Corretora. Todos os direitos reservados.</p>

    function TelaSucesso({ onReiniciar, produto, nome, telefone, linhas }) {
      const msg = encodeURIComponent(`Olá! Acabei de enviar uma cotação de ${NOME_PRODUTO[produto]} pelo site.`);
      const primeiro = (nome || "").trim().split(/\s+/)[0];
      const resumo = (linhas || []).filter((l) => l.valor && l.label !== "Contato");
      React.useEffect(() => { window.scrollTo(0, 0); }, []);
      return (
        <div className="min-h-screen bg-navy relative overflow-hidden flex flex-col">
          <div className="absolute inset-0 hero-brilho" />
          <Header />
          <main className="relative flex-1 flex items-center justify-center px-4 py-10 sm:py-16">
            <div className="cartao p-7 sm:p-10 max-w-md w-full text-center fade-in">
              <div className="w-20 h-20 mx-auto rounded-full shadow-[0_0_0_12px_rgba(212,168,67,.12)]">
                <svg viewBox="0 0 80 80" className="w-20 h-20" aria-hidden="true">
                  <circle cx="40" cy="40" r="36" fill="#fdf8ec" />
                  <circle className="check-circle" cx="40" cy="40" r="36" fill="none" stroke="#d4a843" strokeWidth="4" />
                  <path className="check-mark" d="M24 41l10 10 22-22" fill="none" stroke="#9a7420" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round" />
                </svg>
              </div>
              <h1 className="font-display text-[2rem] font-semibold text-gray-900 mt-7 leading-tight">Pronto{primeiro ? `, ${primeiro}` : ""}!</h1>
              <p className="text-gray-600 text-[15px] mt-3 leading-relaxed">
                Sua cotação de {NOME_PRODUTO[produto]} chegou para a nossa equipe. Um especialista vai comparar as opções e te chamar no WhatsApp{telefone ? <> <strong className="text-gray-900 whitespace-nowrap">{telefone}</strong></> : ""}.
              </p>
              {resumo.length > 0 && (
                <div className="mt-6 rounded-xl bg-[#faf8f3] border border-[#ece8df] px-4 py-2 text-left divide-y divide-[#ece8df]">
                  {resumo.map((l) => {
                    const Icon = l.icon;
                    return (
                      <div key={l.label} className="flex items-center justify-between gap-3 py-2">
                        <span className="flex items-center gap-2 text-sm text-gray-500"><Icon className="w-4 h-4 text-gray-400" />{l.label}</span>
                        <span className="text-[13px] font-semibold text-gray-900 truncate max-w-[12rem]">{l.valor}</span>
                      </div>
                    );

              )}
              <p className="nota mt-4 text-left"><InfoIcon className="w-4 h-4 text-gold-dark flex-shrink-0 mt-0.5" />Salve o nosso número {WHATSAPP_EXIBICAO} para não perder a resposta.</p>
              <div className="mt-6 space-y-2.5">
                <a href={`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`} target="_blank" rel="noopener noreferrer" className="btn btn-primario w-full">
                  <WhatsAppIcon className="w-5 h-5" /> Abrir o WhatsApp da Cassiano
                </a>
                <button type="button" onClick={onReiniciar} className="btn btn-contorno w-full">Cotar outro seguro</button>
              </div>
            </div>
          </main>
        </div>
      );
    }

    // ==================== APP ====================
    const DADOS_INICIAIS = {
      nome: "", telefone: "", consentimento: false, observacao: "", codigoFipe: "", valorFipe: null,
      // veicular
      veiculoTipo: "Carro", zeroKm: false, placa: "", marca: "", modelo: "", ano: "", versao: "", combustivel: "", cor: "",
      condutorNome: "", cpf: "", nascimento: "",
      utilizacao: "", garagem: "", garagemEmpresa: "", jovem: "", seguroAtual: "", seguroAtualInfo: "",
      // celular
      celularModelo: "", celularTemNota: "",
      // saúde
      saudeVidas: "", saudeIdades: "", saudeEmail: "", saudeCnpj: "", saudeTemHospital: "", saudeHospital: "",
      // residencial
      resTipo: "", resOcupacao: "",
    };

    function App() {
      const [produto, setProduto] = useState("veicular");
      const [d, setD] = useState(DADOS_INICIAIS);
      const [errors, setErrors] = useState({});
      const [enviado, setEnviado] = useState(false);
      const [enviando, setEnviando] = useState(false);
      const [envioErro, setEnvioErro] = useState("");
      const [pageReady, setPageReady] = useState(false);

      const limparErro = (k) => setErrors((p) => (p[k] ? { ...p, [k]: null } : p));
      const muda = (k) => (v) => { setD((p) => ({ ...p, [k]: v })); limparErro(k); };

      const end = useEndereco();
      const endTrabalho = useEndereco();
      const docVeiculo = useUploads("documentos");
      const cnh = useUploads("cnh");
      const notaFiscal = useUploads("nota-fiscal");
      const docPessoal = useUploads("documento-pessoal");

      // ---------- Placa ----------
      const [placaStatus, setPlacaStatus] = useState("idle"); // idle | buscando | encontrado | nao_encontrado | indisponivel
      const [placaVeiculo, setPlacaVeiculo] = useState(null);
      const [placaVersoes, setPlacaVersoes] = useState([]); // versões FIPE possíveis para a placa
      const [placaConfirmada, setPlacaConfirmada] = useState(false);
      const [modoManual, setModoManual] = useState(false);
      const consultaRef = useRef(0);
      const esperaPlacaRef = useRef(null);
      const placasConsultadas = useRef(new Map()); // placa -> resultado (não cobra de novo a mesma placa na mesma visita)

      // Preenche o formulário com o veículo encontrado (ou com a versão FIPE escolhida pelo cliente).
      const aplicarVeiculo = (v) => {
        setPlacaVeiculo(v);
        setD((p) => ({
          ...p,
          veiculoTipo: v.tipo || p.veiculoTipo,
          marca: v.marca || p.marca, modelo: v.modelo || p.modelo,
          ano: v.anoModelo || v.anoFabricacao || p.ano,
          versao: v.versao || "", combustivel: v.combustivel || p.combustivel, cor: v.cor || p.cor,
          codigoFipe: v.codigoFipe || "", valorFipe: v.valorFipe || null,
        }));
        setErrors((p) => ({ ...p, marca: null, modelo: null, ano: null }));
      };

      const consultarPlaca = async (valor = d.placa) => {
        if (!placaValida(valor)) return;
        const minha = ++consultaRef.current;
        setPlacaStatus("buscando"); setPlacaConfirmada(false); limparErro("placa"); limparErro("veiculo");
        let status = "indisponivel", versoes = [];
        const jaConsultada = placasConsultadas.current.get(valor);
        if (jaConsultada) ({ status, versoes } = jaConsultada);
        else try {
          const ctrl = new AbortController();
          const t = setTimeout(() => ctrl.abort(), PLACA_TIMEOUT_MS);
          const res = await fetch(`${PLACA_API_URL}?p=${encodeURIComponent(valor)}`, { signal: ctrl.signal });
          clearTimeout(t);
          const json = (res.headers.get("content-type") || "").includes("application/json") ? await res.json() : null;
          if (json && json.ok && json.veiculo) { status = "encontrado"; versoes = Array.isArray(json.versoes) && json.versoes.length ? json.versoes : [json.veiculo]; }
          else if (json && json.erro === "nao_encontrada") status = "nao_encontrado";
        } catch { /* rede/tempo esgotado: cai no preenchimento manual */ }
        if (status !== "indisponivel") placasConsultadas.current.set(valor, { status, versoes });
        if (minha !== consultaRef.current) return; // o cliente já digitou outra placa
        setPlacaStatus(status);
        setPlacaVersoes(versoes);
        setPlacaVeiculo(null);
        if (versoes.length) { aplicarVeiculo(versoes[0]); setModoManual(false); }
      };

      const mudaPlaca = (v) => {
        setD((p) => ({ ...p, placa: v }));
        limparErro("placa");
        if (placaStatus !== "idle") { consultaRef.current++; setPlacaStatus("idle"); setPlacaVeiculo(null); setPlacaVersoes([]); setPlacaConfirmada(false); }
        // Cada consulta custa: espera a pessoa parar de digitar antes de consultar sozinho.
        clearTimeout(esperaPlacaRef.current);
        if (placaValida(v)) esperaPlacaRef.current = setTimeout(() => consultarPlaca(v), 600);
      };

      const mostrarCamposVeiculo = d.zeroKm || modoManual || placaStatus === "nao_encontrado" || placaStatus === "indisponivel"
        || !!(errors.marca || errors.modelo || errors.ano); // a placa achou o carro mas faltou algum dado

      // ---------- Etapas do fluxo veicular ----------
      const [etapa, setEtapa] = useState(1);
      const [visitadas, setVisitadas] = useState(new Set([1]));
      const [dir, setDir] = useState(1);
      const [shaking, setShaking] = useState(false);
      const painelRef = useRef(null);
      const primeiraRender = useRef(true);

      const tremer = () => {
        setShaking(true); setTimeout(() => setShaking(false), 400);
        setTimeout(() => {
          const el = document.querySelector('#cotacao [aria-invalid="true"], #cotacao .field-error');
          if (!el) return;
          el.scrollIntoView({ block: "center", behavior: "smooth" });
          if (el.matches("input, select, textarea")) el.focus({ preventScroll: true });
        }, 60);
      };

      // Ao trocar de etapa: foco no título (leitor de tela) e rola até o painel se ele ficou para cima.
      React.useEffect(() => {
        if (primeiraRender.current) { primeiraRender.current = false; return; }
        const el = painelRef.current;
        if (!el) return;
        el.querySelector("h3")?.focus({ preventScroll: true });
        const topo = (el.closest(".cartao") || el).getBoundingClientRect().top;
        if (topo < 0) window.scrollTo({ top: window.scrollY + topo - 12, behavior: "instant" });
      }, [etapa]);

      React.useEffect(() => {
        const preloader = document.getElementById("preloader");
        if (!preloader) { setPageReady(true); return; }
        const t = setTimeout(() => { preloader.classList.add("preloader-hide"); setTimeout(() => { preloader.remove(); setPageReady(true); }, 400); }, 200);
        return () => clearTimeout(t);
      }, []);

      React.useEffect(() => { setEtapa(1); setVisitadas(new Set([1])); setErrors({}); setDir(1); setEnvioErro(""); }, [produto]);

      // ---------- Validações ----------
      const validarContato = (e) => {
        if (!d.nome.trim() || d.nome.trim().length < 3) e.nome = "Digite seu nome e sobrenome.";
        if (!telefoneValido(d.telefone)) e.telefone = "Informe seu WhatsApp com DDD.";
        if (!d.consentimento) e.consentimento = "Marque a caixa acima para a gente poder te responder.";
      };
      const validarEndereco = (e, alvo = end, prefixo = "", simples = false) => {
        if (soDigitos(alvo.cep).length !== 8) e[`${prefixo}cep`] = "Informe o CEP.";
        else if (alvo.status === "nao_encontrado") e[`${prefixo}cep`] = "CEP não encontrado.";
        else if (!simples && alvo.status !== "buscando" && !alvo.endereco.trim()) e[`${prefixo}endereco`] = "Informe o endereço.";
      };

      const validarEtapa = (n) => {
        const e = {};
        if (n === 1) {
          if (!d.zeroKm) {
            if (d.placa && !placaValida(d.placa)) e.placa = "Placa inválida. Use o formato ABC1234 ou ABC1D23.";
            else if (!d.placa && !modoManual) e.placa = "Digite a placa ou toque em “Não sei a placa”.";
          }
          if (placaStatus === "encontrado" && !placaConfirmada && !modoManual) e.veiculo = "Confirme se este é o seu veículo.";
          else if (placaStatus === "buscando") e.veiculo = "Aguarde, estamos buscando seu veículo.";
          else {
            if (!d.marca.trim()) e.marca = "Informe a marca.";
            if (!d.modelo.trim()) e.modelo = "Informe o modelo.";
            if (!d.ano) e.ano = "Selecione o ano.";
          }
        }
        if (n === 2) {
          if (!d.condutorNome.trim() || d.condutorNome.trim().length < 3) e.condutorNome = "Informe o nome do condutor.";
          if (!cpfValido(d.cpf)) e.cpf = "Informe um CPF válido.";
          const idade = idadeDe(d.nascimento);
          if (idade === null) e.nascimento = "Informe a data no formato dd/mm/aaaa.";
          else if (idade < 18 || idade > 100) e.nascimento = "Confira a data de nascimento.";
        }
        if (n === 3) {
          if (!d.utilizacao) e.utilizacao = "Selecione como o veículo é usado.";
          if (!d.garagem) e.garagem = "Informe se tem garagem em casa.";
          if (d.utilizacao === "Lazer + trabalho" && !d.garagemEmpresa) e.garagemEmpresa = "Informe se tem garagem no trabalho.";
          if (d.utilizacao === "Lazer + trabalho" && d.garagemEmpresa === "Sim") validarEndereco(e, endTrabalho, "trab_", true);
          if (!d.jovem) e.jovem = "Escolha Sim ou Não.";
          if (!d.seguroAtual) e.seguroAtual = "Escolha Sim ou Não.";
        }
        if (n === 4) validarEndereco(e);
        if (n === 5) validarContato(e);
        setErrors(e);
        return Object.keys(e).length === 0;
      };

      const avancar = () => {
        if (!validarEtapa(etapa)) { tremer(); return; }
        if (etapa === 2 && !d.nome) setD((p) => ({ ...p, nome: p.condutorNome }));
        if (etapa < ETAPAS_VEICULAR.length) {
          setDir(1); setEtapa(etapa + 1); setVisitadas((v) => new Set(v).add(etapa + 1)); setErrors({});
        } else enviarVeicular();
      };
      const voltar = () => { setDir(-1); setEtapa((e) => Math.max(1, e - 1)); setErrors({}); };
      const irPara = (n) => { setDir(n >= etapa ? 1 : -1); setEtapa(n); setErrors({}); };

      // ---------- Envio pelo WhatsApp (reaproveitado por todos os produtos) ----------
      // O envio passa pelo servidor (api/enviar.js): a chave do WhatsApp não fica no navegador, a cotação
      // vai sempre para a corretora e o cliente recebe uma confirmação de texto fixo.
      async function enviarPeloWhatsApp({ mensagemCorretora, imagens }) {
        setEnviando(true); setEnvioErro("");
        try {
          const res = await fetch(ENVIO_API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ produto, mensagemCorretora, imagens: imagens || [], nomeCliente: d.nome, numeroCliente: soDigitos(d.telefone) }),
          });
          let data = null;
          try { data = await res.json(); } catch { /* resposta não-JSON */ }
          if (res.ok && data && data.ok) setEnviado(true);
          else if (data && data.erro === "limite") setEnvioErro("Recebemos vários envios seguidos daqui. Aguarde alguns minutos e tente de novo.");
          else { console.error("Falha no envio:", res.status, data); setEnvioErro("Tente de novo em instantes."); }
        } catch (err) {
          console.error(err);
          setEnvioErro("Verifique sua conexão e tente de novo.");
        }
        setEnviando(false);
      }

      const emoji = (code) => String.fromCodePoint(code);
      const PIN = emoji(0x1F4CD), CAR = emoji(0x1F697), HOUSE = emoji(0x1F3E0), CHECK = emoji(0x2705), PHONE = emoji(0x1F4F1),
        NOTE = emoji(0x1F4DD), RECEIPT = emoji(0x1F9FE), HOSPITAL = emoji(0x1F3E5), PERSON = emoji(0x1F464),
        SHIELD = emoji(0x1F6E1), PEOPLE = emoji(0x1F465), MAIL = emoji(0x1F4E7);

      const linhaCliente = () => `${PERSON} *Cliente:* ${d.nome.trim()}\n${PHONE} *WhatsApp:* ${d.telefone}`;
      const linhaObs = () => (d.observacao.trim() ? `\n\n${NOTE} *Observação:*\n${d.observacao.trim()}` : "");
      const fotos = (lista, nome) => lista.items.filter((i) => i.url).map((item, i, arr) => ({ url: item.url, caption: arr.length > 1 ? `${nome} (${i + 1}/${arr.length})` : nome }));

      const enviarVeicular = async () => {
        const veiculo = `${d.veiculoTipo} — ${d.marca} ${d.modelo}`.trim() + (d.ano ? ` (${d.ano})` : "");
        const origem = d.zeroKm ? "0 km, ainda sem placa" : placaStatus === "encontrado" && placaConfirmada ? "consultados pela placa e confirmados pelo cliente" : "informados pelo cliente";
        const idade = idadeDe(d.nascimento);
        const trabalho = d.utilizacao === "Lazer + trabalho"
          ? `\n🏢 Garagem no trabalho: ${d.garagemEmpresa}${d.garagemEmpresa === "Sim" ? ` (CEP ${endTrabalho.cep}${endTrabalho.cidade ? ` - ${endTrabalho.cidade}/${endTrabalho.uf}` : ""})` : ""}` : "";

        const mensagemCorretora = `${CHECK} *Nova cotação de Seguro Auto!*\n\n${linhaCliente()}`
          + `\n\n${CAR} *Veículo:* ${veiculo}\n*Placa:* ${d.zeroKm ? "0 km (sem placa)" : d.placa || "não informada"}`
          + `${d.versao ? `\nVersão: ${d.versao}` : ""}${d.combustivel ? `\nCombustível: ${d.combustivel}` : ""}${d.cor ? `\nCor: ${d.cor}` : ""}`
          + `${placaConfirmada && d.codigoFipe ? `\nCódigo FIPE: ${d.codigoFipe}${d.valorFipe ? ` (${formatReais(d.valorFipe)})` : ""}` : ""}\n_Dados ${origem}._`
          + `\n\n${PERSON} *Condutor principal:*\n${d.condutorNome.trim()}\nCPF: ${d.cpf}\nNascimento: ${d.nascimento}${idade !== null ? ` (${idade} anos)` : ""}`
          + `\n\n${CAR} *Uso:* ${d.utilizacao}\n${HOUSE} Garagem em casa: ${d.garagem}${trabalho}\n👶 Mora com condutor de 18 a 25 anos: ${d.jovem}`
          + `\n${SHIELD} Já tem seguro: ${d.seguroAtual}${d.seguroAtual === "Sim" && d.seguroAtualInfo.trim() ? ` — ${d.seguroAtualInfo.trim()}` : ""}`
          + `\n\n${PIN} *Pernoite:*\n${end.textoCompleto()}\n*CEP:* ${end.cep}${linhaObs()}`;


        await enviarPeloWhatsApp({ mensagemCorretora, imagens: [...fotos(docVeiculo, "Documento do veículo"), ...fotos(cnh, "CNH do condutor")] });
      };

      const validarEEnviar = (validar, enviar) => () => {
        const e = {};
        validar(e);
        validarContato(e);
        setErrors(e);
        if (Object.keys(e).length) { tremer(); return; }
        enviar();
      };

      const enviarCelular = validarEEnviar((e) => {
        if (!d.celularModelo.trim()) e.celularModelo = "Informe o modelo do celular.";
        if (!d.celularTemNota) e.celularTemNota = "Informe se você tem a nota fiscal.";
        if (d.celularTemNota === "Sim" && notaFiscal.items.length === 0) e.notaFiscal = "Envie a foto da nota fiscal.";
        if (d.celularTemNota === "Não") validarEndereco(e);
      }, async () => {
        const mensagemCorretora = `${CHECK} *Nova cotação de Seguro Celular!*\n\n${linhaCliente()}\n\n${PHONE} *Aparelho:* ${d.celularModelo.trim()}\n${RECEIPT} *Tem nota fiscal:* ${d.celularTemNota}`
          + (d.celularTemNota === "Não" ? `\n\n${PIN} *Endereço:*\n${end.textoCompleto()}\n*CEP:* ${end.cep}` : "") + linhaObs();
        const imagens = d.celularTemNota === "Sim" ? fotos(notaFiscal, "Nota fiscal do aparelho") : fotos(docPessoal, "Documento pessoal");
        await enviarPeloWhatsApp({ mensagemCorretora, imagens });
      });

      const enviarSaude = validarEEnviar((e) => {
        if (!d.saudeVidas) e.saudeVidas = "Selecione quantas pessoas.";
        if (!d.saudeIdades.trim()) e.saudeIdades = "Informe a idade de cada pessoa.";
        if (d.saudeEmail.trim() && !/^\S+@\S+\.\S+$/.test(d.saudeEmail.trim())) e.saudeEmail = "Confira o e-mail.";
        if (!d.saudeCnpj) e.saudeCnpj = "Escolha Sim ou Não.";
        validarEndereco(e, end, "", true);
        if (!d.saudeTemHospital) e.saudeTemHospital = "Escolha Sim ou Não.";
        if (d.saudeTemHospital === "Sim" && !d.saudeHospital.trim()) e.saudeHospital = "Informe o hospital.";
      }, async () => {
        const regiao = end.cidade ? `${end.cidade}/${end.uf}` : "";
        const mensagemCorretora = `${CHECK} *Nova cotação de Plano de Saúde!*\n\n${linhaCliente()}${d.saudeEmail.trim() ? `\n${MAIL} *E-mail:* ${d.saudeEmail.trim()}` : ""}`
          + `\n\n${PEOPLE} *Pessoas no plano:* ${d.saudeVidas}\n🎂 *Idades:* ${d.saudeIdades.trim()}\n🏢 *Tem CNPJ ou MEI:* ${d.saudeCnpj}`
          + `\n\n${PIN} *CEP:* ${end.cep}${regiao ? ` (${regiao})` : ""}\n${HOSPITAL} *Hospital de preferência:* ${d.saudeTemHospital === "Sim" ? d.saudeHospital.trim() : "Sem preferência"}` + linhaObs();
        await enviarPeloWhatsApp({ mensagemCorretora });
      });

      const enviarResidencial = validarEEnviar((e) => {
        if (!d.resTipo) e.resTipo = "Selecione o tipo de imóvel.";
        if (!d.resOcupacao) e.resOcupacao = "Selecione uma opção.";
        validarEndereco(e);
      }, async () => {
        const mensagemCorretora = `${CHECK} *Nova cotação de Seguro Residencial!*\n\n${linhaCliente()}\n\n${HOUSE} *Imóvel:* ${d.resTipo}, ${d.resOcupacao.toLowerCase()}\n\n${PIN} *Endereço:*\n${end.textoCompleto()}\n*CEP:* ${end.cep}` + linhaObs();
        await enviarPeloWhatsApp({ mensagemCorretora, imagens: fotos(docPessoal, "Documento pessoal") });
      });

      const reiniciarTudo = () => {
        setEnviado(false); setProduto("veicular"); setD(DADOS_INICIAIS); setErrors({}); setEnvioErro("");
        [docVeiculo, cnh, notaFiscal, docPessoal, end, endTrabalho].forEach((x) => x.reset());
        setPlacaStatus("idle"); setPlacaVeiculo(null); setPlacaVersoes([]); setPlacaConfirmada(false); setModoManual(false);
        setEtapa(1); setVisitadas(new Set([1]));
      };

      // ---------- Resumo lateral ----------
      const cidadeUf = end.cidade ? `${end.cidade}/${end.uf}` : (soDigitos(end.cep).length === 8 ? end.cep : null);
      const veiculoResumo = d.marca || d.modelo ? `${d.marca} ${d.modelo}${d.ano ? ` ${d.ano}` : ""}`.trim() : null;
      const linhasResumo = {
        veicular: [
          { icon: d.veiculoTipo === "Moto" ? MotorcycleIcon : CarIcon, label: "Veículo", valor: veiculoResumo },
          { icon: UserIcon, label: "Condutor", valor: d.condutorNome.trim() ? d.condutorNome.trim().split(" ")[0] : null },
          { icon: RouteIcon, label: "Dia a dia", valor: d.utilizacao || null },
          { icon: MapPinIcon, label: "Local", valor: cidadeUf },
          { icon: WhatsAppIcon, label: "Contato", valor: telefoneValido(d.telefone) ? d.telefone : null },
        ],
        celular: [
          { icon: PhoneIcon, label: "Aparelho", valor: d.celularModelo.trim() || null },
          { icon: ReceiptIcon, label: "Nota fiscal", valor: d.celularTemNota || null },
          { icon: WhatsAppIcon, label: "Contato", valor: telefoneValido(d.telefone) ? d.telefone : null },
        ],
        saude: [
          { icon: UsersIcon, label: "Pessoas", valor: d.saudeVidas || null },
          { icon: MapPinIcon, label: "Região", valor: cidadeUf },
          { icon: HospitalIcon, label: "Hospital", valor: d.saudeTemHospital === "Sim" ? (d.saudeHospital.trim() || null) : d.saudeTemHospital === "Não" ? "Sem preferência" : null },
          { icon: WhatsAppIcon, label: "Contato", valor: telefoneValido(d.telefone) ? d.telefone : null },
        ],
        residencial: [
          { icon: d.resTipo === "Apartamento" ? BuildingIcon : HomeIcon, label: "Imóvel", valor: d.resTipo ? `${d.resTipo}${d.resOcupacao ? `, ${d.resOcupacao.toLowerCase()}` : ""}` : null },
          { icon: MapPinIcon, label: "Endereço", valor: cidadeUf },
          { icon: WhatsAppIcon, label: "Contato", valor: telefoneValido(d.telefone) ? d.telefone : null },
        ],
      }[produto];

      if (enviado) return <TelaSucesso onReiniciar={reiniciarTudo} produto={produto} nome={d.nome} telefone={d.telefone} linhas={linhasResumo} />;

      // Bloco de contato + observação + autorização, igual no fim de todos os produtos
      const blocoContato = (
        <div className="space-y-4">
          <div className="grid sm:grid-cols-2 gap-4">
            <CampoNome valor={d.nome} onChange={muda("nome")} error={errors.nome} />
            <CampoWhatsApp valor={d.telefone} onChange={muda("telefone")} error={errors.telefone} />
          </div>
          <Campo label="Alguma observação?" opcional>
            <textarea value={d.observacao} onChange={(e) => muda("observacao")(e.target.value)} rows={3} placeholder="Ex.: melhor horário para falar, coberturas que você quer..." className="campo" />
          </Campo>
          <Consentimento marcado={d.consentimento} onChange={muda("consentimento")} error={errors.consentimento} />
        </div>
      );

      const cartaoProduto = (titulo, subtitulo, corpo, onEnviar) => (
        <div className={`cartao p-5 sm:p-8 ${shaking ? "shake-once" : ""}`}>
          <TituloEtapa titulo={titulo} subtitulo={subtitulo} />
          <div className="space-y-6">{corpo}</div>
          <div className="mt-6 pt-6 border-t border-gray-100">{blocoContato}</div>
          <AvisoEnvio mensagem={envioErro} />
          <div className="flex mt-6"><BotaoEnviar onClick={onEnviar} enviando={enviando} className="w-full sm:w-auto sm:ml-auto sm:px-8" /></div>
        </div>
      );

      return (
        <div className={`min-h-screen bg-fundo ${pageReady ? "page-ready" : ""}`}>
          <Header />
          <Hero produto={produto} />
          <SeletorProduto produto={produto} setProduto={setProduto} />

          <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8 scroll-mt-4" id="cotacao">
            <div className="flex flex-col lg:flex-row gap-6 items-start">
              <div className="w-full lg:flex-1 min-w-0">
                <div key={produto} className="panel-fade-enter">

                {produto === "veicular" && (
                  <>
                    <div className="cartao">
                    <Stepper etapas={ETAPAS_VEICULAR} etapaAtual={etapa} onIr={irPara} etapasVisitadas={visitadas} />
                    <div ref={painelRef} key={etapa} style={{ "--dir": dir }} className={`p-5 sm:p-8 step-panel-enter ${shaking ? "shake-once" : ""}`}>

                      {etapa === 1 && (
                        <div>
                          <TituloEtapa titulo="Qual veículo você quer segurar?" subtitulo="Pela placa, a gente preenche o resto para você." />
                          <div className="space-y-6">
                            <div>
                              <Pergunta>Tipo de veículo</Pergunta>
                              <Opcoes rotulo="Tipo de veículo" valor={d.veiculoTipo} onChange={muda("veiculoTipo")} opcoes={[{ value: "Carro", icon: CarIcon }, { value: "Moto", icon: MotorcycleIcon }]} />
                            </div>

                            {!d.zeroKm && (
                              <PlacaConsulta placa={d.placa} onPlaca={mudaPlaca} status={placaStatus} onConsultar={() => consultarPlaca()} veiculo={placaVeiculo} versoes={placaVersoes} onVersao={aplicarVeiculo}
                                confirmada={placaConfirmada} onConfirmar={() => { setPlacaConfirmada(true); limparErro("veiculo"); }}
                                onCorrigir={() => { setPlacaConfirmada(false); setModoManual(true); limparErro("veiculo"); }}
                                onManual={() => { setModoManual(true); limparErro("placa"); }} error={errors.placa || errors.veiculo} />
                            )}

                            <label className="flex items-center gap-3 cursor-pointer w-fit">
                              <input type="checkbox" checked={d.zeroKm} onChange={(e) => { muda("zeroKm")(e.target.checked); limparErro("placa"); }} className="w-5 h-5 rounded accent-[#d4a843]" />
                              <span className="text-sm text-gray-700">É um veículo <strong>0 km</strong> (ainda sem placa)</span>
                            </label>

                            {mostrarCamposVeiculo && (
                              <div className="fade-in grid grid-cols-1 sm:grid-cols-2 gap-4" id="campos-veiculo">
                                <Campo label="Marca" error={errors.marca}><input type="text" value={d.marca} onChange={(e) => muda("marca")(e.target.value)} placeholder="Ex.: Volkswagen" className="campo" /></Campo>
                                <Campo label="Modelo" error={errors.modelo}><input type="text" value={d.modelo} onChange={(e) => muda("modelo")(e.target.value)} placeholder="Ex.: Gol" className="campo" /></Campo>
                                <Campo label="Ano do modelo" error={errors.ano}>
                                  <select value={d.ano} onChange={(e) => muda("ano")(e.target.value)} className={`campo ${d.ano ? "" : "vazio"}`}>
                                    <option value="">Selecione</option>
                                    {ANOS_VEICULO.map((a) => <option key={a} value={a}>{a}</option>)}
                                  </select>
                                </Campo>
                                <Campo label="Versão" opcional><input type="text" value={d.versao} onChange={(e) => muda("versao")(e.target.value)} placeholder="Ex.: 1.0 Flex" className="campo" /></Campo>
                                <Campo label="Combustível" opcional>
                                  <select value={d.combustivel} onChange={(e) => muda("combustivel")(e.target.value)} className={`campo ${d.combustivel ? "" : "vazio"}`}>
                                    <option value="">Selecione</option>
                                    {COMBUSTIVEIS.map((c) => <option key={c} value={c}>{c}</option>)}
                                  </select>
                                </Campo>
                                <Campo label="Cor" opcional><input type="text" value={d.cor} onChange={(e) => muda("cor")(e.target.value)} placeholder="Ex.: Prata" className="campo" /></Campo>
                              </div>
                            )}

                            <UploadField label="Foto do documento (CRLV)" opcional description="Agiliza a análise, mas não é obrigatório. Frente e verso se precisar." uploads={docVeiculo} id="upload-doc" />
                          </div>
                        </div>
                      )}

                      {etapa === 2 && (
                        <div>
                          <TituloEtapa titulo="Quem dirige o veículo?" subtitulo="Os dados do condutor principal influenciam bastante no preço." />
                          <div className="space-y-5">
                            <CampoNome label="Nome completo do condutor" valor={d.condutorNome} onChange={muda("condutorNome")} error={errors.condutorNome} />
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                              <Campo label="CPF" error={errors.cpf}>
                                <input type="text" inputMode="numeric" value={d.cpf} onChange={(e) => { const v = formatCpf(e.target.value); muda("cpf")(v); if (v.length === 14 && cpfValido(v)) document.querySelector('[data-campo="nascimento"]')?.focus(); }} placeholder="000.000.000-00" enterKeyHint="next" autoComplete="off" className="campo" />
                              </Campo>
                              <Campo label="Data de nascimento" error={errors.nascimento}>
                                <input type="text" inputMode="numeric" autoComplete="bday" enterKeyHint="next" data-campo="nascimento" value={d.nascimento} onChange={(e) => muda("nascimento")(formatData(e.target.value))} placeholder="dd/mm/aaaa" className="campo" />
                              </Campo>
                            </div>
                            <p className="nota"><LockIcon className="w-4 h-4 text-gold-dark flex-shrink-0 mt-0.5" />Com o CPF as seguradoras consultam seu histórico e bônus. Usamos só para a cotação.</p>
                            <UploadField label="Foto da CNH" opcional description="Se preferir, envie a CNH e conferimos os dados por você." uploads={cnh} id="upload-cnh" />
                          </div>
                        </div>
                      )}

                      {etapa === 3 && (
                        <div>
                          <TituloEtapa titulo="Como o veículo é usado?" subtitulo="Perguntas rápidas que mudam o valor do seguro." />
                          <div className="space-y-6">
                            <Opcoes rotulo="Utilização" colunas={3} valor={d.utilizacao} onChange={muda("utilizacao")} error={errors.utilizacao} opcoes={[
                              { value: "Lazer", label: "Lazer e dia a dia", sub: "Passeios, mercado, escola", icon: SunIcon },
                              { value: "Lazer + trabalho", label: "Também vai ao trabalho", sub: "Ida e volta do serviço", icon: BriefcaseIcon },
                              { value: "Trabalho (aplicativo)", label: "Aplicativo", sub: "Uber, 99, entregas", icon: PhoneIcon },
                            ]} />
                            <div>
                              <Pergunta>Tem garagem em casa?</Pergunta>
                              <Segmentado rotulo="Garagem em casa" valor={d.garagem} onChange={muda("garagem")} opcoes={SIM_NAO} error={errors.garagem} />
                            </div>
                            {d.utilizacao === "Lazer + trabalho" && (
                              <div className="fade-in space-y-4 rounded-2xl bg-gray-50 p-4 sm:p-5">
                                <div>
                                  <Pergunta>Tem garagem no trabalho?</Pergunta>
                                  <Segmentado rotulo="Garagem no trabalho" valor={d.garagemEmpresa} onChange={muda("garagemEmpresa")} opcoes={SIM_NAO} error={errors.garagemEmpresa} />
                                </div>
                                {d.garagemEmpresa === "Sim" && (
                                  <div className="fade-in"><EnderecoFields end={endTrabalho} errors={errors} limparErro={limparErro} prefixo="trab_" simples rotuloCep="CEP do trabalho" /></div>
                                )}
                              </div>
                            )}
                            <div>
                              <Pergunta>Mora com alguém de 18 a 25 anos que dirige este veículo?</Pergunta>
                              <Segmentado rotulo="Condutor jovem" valor={d.jovem} onChange={muda("jovem")} opcoes={SIM_NAO} error={errors.jovem} />
                            </div>
                            <div>
                              <Pergunta>O veículo já tem seguro?</Pergunta>
                              <Segmentado rotulo="Seguro atual" valor={d.seguroAtual} onChange={muda("seguroAtual")} opcoes={SIM_NAO} error={errors.seguroAtual} />
                              {d.seguroAtual === "Sim" && (
                                <div className="fade-in mt-4">
                                  <Campo label="Seguradora e mês de vencimento" opcional dica="Na renovação você pode manter o bônus.">
                                    <input type="text" value={d.seguroAtualInfo} onChange={(e) => muda("seguroAtualInfo")(e.target.value)} placeholder="Ex.: Porto Seguro, vence em março" className="campo" />
                                  </Campo>
                                </div>
                              )}
                            </div>
                          </div>
                        </div>
                      )}

                      {etapa === 4 && (
                        <div>
                          <TituloEtapa titulo="Onde o veículo passa a noite?" subtitulo="O CEP de pernoite é um dos itens que mais pesam no preço." />
                          <EnderecoFields end={end} errors={errors} limparErro={limparErro} rotuloCep="CEP de pernoite" />
                        </div>
                      )}

                      {etapa === 5 && (
                        <div>
                          <TituloEtapa titulo="Para onde mandamos suas opções?" subtitulo="Última etapa. A resposta chega no seu WhatsApp." />
                          {blocoContato}
                          <AvisoEnvio mensagem={envioErro} />
                        </div>
                      )}

                      <NavegacaoEtapas etapaAtual={etapa} totalEtapas={ETAPAS_VEICULAR.length} onVoltar={voltar} onContinuar={avancar} enviando={enviando} />
                    </div>
                    </div>
                  </>
                )}

                {produto === "celular" && cartaoProduto("Sobre o seu celular", "Conte qual aparelho você quer proteger.", (
                  <>
                    <Campo label="Modelo do celular" error={errors.celularModelo}>
                      <input type="text" value={d.celularModelo} onChange={(e) => muda("celularModelo")(e.target.value)} placeholder="Ex.: iPhone 15 Pro 256 GB" className="campo" />
                    </Campo>
                    <div>
                      <Pergunta>Você tem a nota fiscal do aparelho?</Pergunta>
                      <Segmentado rotulo="Nota fiscal" valor={d.celularTemNota} onChange={muda("celularTemNota")} error={errors.celularTemNota} opcoes={[{ value: "Sim", label: "Sim, tenho" }, { value: "Não", label: "Não tenho" }]} />
                    </div>
                    {d.celularTemNota === "Sim" && (
                      <div className="fade-in"><UploadField label="Nota fiscal do aparelho" description="Uma foto ou print da nota fiscal." uploads={notaFiscal} id="upload-nota" error={errors.notaFiscal} /></div>
                    )}
                    {d.celularTemNota === "Não" && (
                      <div className="fade-in space-y-5">
                        <EnderecoFields end={end} errors={errors} limparErro={limparErro} />
                        <UploadField label="Documento pessoal" opcional description="RG ou CNH. Agiliza a análise." uploads={docPessoal} id="upload-doc-pessoal-celular" />
                      </div>
                    )}
                  </>
                ), enviarCelular)}

                {produto === "saude" && cartaoProduto("Sobre o plano de saúde", "Com estas informações já dá para comparar os planos.", (
                  <>
                    <div className="grid sm:grid-cols-2 gap-4">
                      <Campo label="Quantas pessoas no plano?" error={errors.saudeVidas}>
                        <select value={d.saudeVidas} onChange={(e) => muda("saudeVidas")(e.target.value)} className={`campo ${d.saudeVidas ? "" : "vazio"}`}>
                          <option value="">Selecione</option>
                          {["Só eu", "2", "3", "4", "5", "6 ou mais"].map((v) => <option key={v} value={v}>{v}</option>)}
                        </select>
                      </Campo>
                      <Campo label="Idade de cada pessoa" error={errors.saudeIdades}>
                        <input type="text" value={d.saudeIdades} onChange={(e) => muda("saudeIdades")(e.target.value)} placeholder="Ex.: 34, 32 e 5" className="campo" />
                      </Campo>
                    </div>
                    <div>
                      <Pergunta>Você tem CNPJ ou MEI?</Pergunta>
                      <Segmentado rotulo="CNPJ ou MEI" valor={d.saudeCnpj} onChange={muda("saudeCnpj")} opcoes={SIM_NAO} error={errors.saudeCnpj} />
                      <p className="text-xs text-gray-500 mt-2">Planos empresariais costumam sair mais em conta.</p>
                    </div>
                    <EnderecoFields end={end} errors={errors} limparErro={limparErro} simples rotuloCep="CEP onde você mora" />
                    <div>
                      <Pergunta>Tem algum hospital de preferência?</Pergunta>
                      <Segmentado rotulo="Hospital de preferência" valor={d.saudeTemHospital} onChange={muda("saudeTemHospital")} opcoes={[{ value: "Não", label: "Sem preferência" }, { value: "Sim", label: "Sim" }]} error={errors.saudeTemHospital} />
                      {d.saudeTemHospital === "Sim" && (
                        <div className="fade-in mt-4">
                          <Campo label="Hospital de preferência" error={errors.saudeHospital}><input type="text" value={d.saudeHospital} onChange={(e) => muda("saudeHospital")(e.target.value)} placeholder="Nome do hospital" className="campo" /></Campo>
                        </div>
                      )}
                    </div>
                    <Campo label="E-mail" opcional error={errors.saudeEmail}>
                      <input type="email" autoComplete="email" value={d.saudeEmail} onChange={(e) => muda("saudeEmail")(e.target.value)} placeholder="seu@email.com" className="campo" />
                    </Campo>
                  </>
                ), enviarSaude)}

                {produto === "residencial" && cartaoProduto("Sobre o seu imóvel", "Conte qual imóvel você quer proteger.", (
                  <>
                    <div>
                      <Pergunta>Tipo de imóvel</Pergunta>
                      <Opcoes rotulo="Tipo de imóvel" valor={d.resTipo} onChange={muda("resTipo")} error={errors.resTipo} opcoes={[{ value: "Casa", icon: HomeIcon }, { value: "Apartamento", icon: BuildingIcon }]} />
                    </div>
                    <div>
                      <Pergunta>O imóvel é</Pergunta>
                      <Segmentado rotulo="Ocupação" valor={d.resOcupacao} onChange={muda("resOcupacao")} error={errors.resOcupacao} opcoes={[{ value: "Próprio" }, { value: "Alugado" }]} />
                    </div>
                    <EnderecoFields end={end} errors={errors} limparErro={limparErro} rotuloCep="CEP do imóvel" />
                    <UploadField label="Documento pessoal" opcional description="RG ou CNH. Agiliza a análise." uploads={docPessoal} id="upload-doc-pessoal-residencial" />
                  </>
                ), enviarResidencial)}

                </div>
                <AjudaLink />
              </div>

              <aside className="w-full lg:w-[22rem] xl:w-[24rem] flex-shrink-0 lg:sticky lg:top-6 space-y-4">
                <div className="hidden lg:block">
                  <ResumoCotacao produto={produto} linhas={linhasResumo} etiqueta={produto === "veicular" ? `Etapa ${etapa} de ${ETAPAS_VEICULAR.length}` : "Em andamento"} />
                </div>
                <AjudaCard />
              </aside>
            </div>
          </main>

          <ComoFunciona />
          <Duvidas />
          <Rodape />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
