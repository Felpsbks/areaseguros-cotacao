    // Função para upload de arquivo ao Supabase Storage
    async function uploadToSupabase(file, folder) {
      const timestamp = Date.now();
      const ext = file.name.split('.').pop() || 'jpg';
      const fileName = `${folder}/${timestamp}_${Math.random().toString(36).slice(2)}.${ext}`;

      const response = await fetch(`${SUPABASE_URL}/storage/v1/object/${STORAGE_BUCKET}/${fileName}`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'apikey': SUPABASE_ANON_KEY,
          'Content-Type': file.type,
        },
        body: file
      });

      if (!response.ok) throw new Error('Erro no upload');

      // Retorna URL pública
      return `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${fileName}`;
    }

    // Componente de Upload
    function UploadField({ label, description, file, onFileChange, id }) {
      const fileInputRef = useRef(null);
      const cameraInputRef = useRef(null);
      const [preview, setPreview] = useState(null);

      const handleFileClick = () => fileInputRef.current?.click();
      const handleCameraClick = () => cameraInputRef.current?.click();

      const handleChange = (e) => {
        const selectedFile = e.target.files?.[0];
        if (selectedFile) {
          onFileChange(selectedFile);
          const reader = new FileReader();
          reader.onload = (ev) => setPreview(ev.target.result);
          reader.readAsDataURL(selectedFile);
        }
      };

      return (
        <div className="flex flex-col sm:flex-row sm:items-center gap-4">

            {/* Input para câmera */}

    // App principal
    function App() {
      const [docFile, setDocFile] = useState(null);
      const [docUrl, setDocUrl] = useState("");
      const [cnhFile, setCnhFile] = useState(null);
      const [cnhUrl, setCnhUrl] = useState("");
      const [uploading, setUploading] = useState(false);
      const [enviado, setEnviado] = useState(false);
      const [telefoneCliente, setTelefoneCliente] = useState("");
      const [cep, setCep] = useState("");
      const [endereco, setEndereco] = useState("");
      const [numero, setNumero] = useState("");
      const [complemento, setComplemento] = useState("");
      const [bairro, setBairro] = useState("");
      const [cidade, setCidade] = useState("");
      const [uf, setUf] = useState("");
      const [loadingCep, setLoadingCep] = useState(false);
      const [cepValido, setCepValido] = useState(false);
      const [utilizacao, setUtilizacao] = useState("");
      const [garagem, setGaragem] = useState("");
      const [garagemEmpresa, setGaragemEmpresa] = useState("");
      const [cepTrabalho, setCepTrabalho] = useState("");
      const [enderecoTrabalho, setEnderecoTrabalho] = useState("");
      const [loadingCepTrabalho, setLoadingCepTrabalho] = useState(false);
      const [cepTrabalhoValido, setCepTrabalhoValido] = useState(false);
      const [errors, setErrors] = useState({});

      const buscarCep = async (cepValue) => {
        const cepLimpo = (cepValue || cep).replace(/\D/g, "");
        if (cepLimpo.length !== 8) {
          setCepValido(false);
          setBairro("");
          setCidade("");
          setUf("");
          setEndereco("");
          return;
        }
        setLoadingCep(true);
        setErrors(prev => ({ ...prev, cep: null }));
        try {
          const res = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
          const data = await res.json();
          if (data.erro) {
            setErrors(prev => ({ ...prev, cep: "CEP não encontrado." }));
            setCepValido(false);
          } else {
            setBairro(data.bairro || "");
            setCidade(data.localidade || "");
            setUf(data.uf || "");
            const endCompleto = `${data.logradouro}${data.logradouro ? ', ' : ''}${data.bairro} - ${data.localidade}/${data.uf}`;
            setEndereco(endCompleto);
            setCepValido(true);
          }
        } catch {
          setErrors(prev => ({ ...prev, cep: "Erro ao buscar CEP. Tente novamente." }));
          setCepValido(false);
        }
        setLoadingCep(false);
      };

      const formatCep = (value) => {
        const nums = value.replace(/\D/g, "").slice(0, 8);
        if (nums.length > 5) return nums.slice(0, 5) + "-" + nums.slice(5);
        return nums;
      };

      const buscarCepTrabalho = async (cepValue) => {
        const cepLimpo = (cepValue || cepTrabalho).replace(/\D/g, "");
        if (cepLimpo.length !== 8) {
          setCepTrabalhoValido(false);
          setEnderecoTrabalho("");
          return;
        }
        setLoadingCepTrabalho(true);
        setErrors(prev => ({ ...prev, cepTrabalho: null }));
        try {
          const res = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
          const data = await res.json();
          if (data.erro) {
            setErrors(prev => ({ ...prev, cepTrabalho: "CEP não encontrado." }));
            setCepTrabalhoValido(false);
          } else {
            const endCompleto = `${data.logradouro}${data.logradouro ? ', ' : ''}${data.bairro} - ${data.localidade}/${data.uf}`;
            setEnderecoTrabalho(endCompleto);
            setCepTrabalhoValido(true);
          }
        } catch {
          setErrors(prev => ({ ...prev, cepTrabalho: "Erro ao buscar CEP." }));
          setCepTrabalhoValido(false);
        }
        setLoadingCepTrabalho(false);
      };

      const validate = () => {
        const newErrors = {};
        if (!docFile) newErrors.doc = "Envie a foto do documento.";
        if (!cnhFile) newErrors.cnh = "Envie a foto da CNH.";
        if (!telefoneCliente.replace(/\D/g, "") || telefoneCliente.replace(/\D/g, "").length < 10) newErrors.telefone = "Informe seu WhatsApp com DDD.";
        if (!cep.replace(/\D/g, "")) newErrors.cep = "Informe o CEP.";
        if (!endereco.trim()) newErrors.endereco = "Informe o endereço completo.";
        if (!utilizacao) newErrors.utilizacao = "Selecione a utilização do veículo.";
        if (!garagem) newErrors.garagem = "Informe se possui garagem.";
        if (utilizacao === "Lazer + trabalho" && !garagemEmpresa) newErrors.garagemEmpresa = "Informe se possui garagem na empresa.";
        if (utilizacao === "Lazer + trabalho" && garagemEmpresa === "Sim" && !cepTrabalho.replace(/\D/g, "")) newErrors.cepTrabalho = "Informe o CEP do trabalho.";
        setErrors(newErrors);
        validate.lastErrors = newErrors;
        return Object.keys(newErrors).length === 0;
      };

      const enviarWhatsApp = async () => {
        if (!validate()) {
          // Scroll até o primeiro campo com erro
          const errorOrder = ['telefone', 'doc', 'cnh', 'cep', 'endereco', 'utilizacao', 'garagem', 'garagemEmpresa', 'cepTrabalho'];
          const sectionIds = {
            telefone: 'section-0',
            doc: 'section-1',
            cnh: 'section-2',
            cep: 'section-3',
            endereco: 'section-3',
            utilizacao: 'section-4',
            garagem: 'section-5',
            garagemEmpresa: 'section-6',
            cepTrabalho: 'section-6'
          };
          const currentErrors = validate.lastErrors || {};
          for (const key of errorOrder) {
            if (currentErrors[key]) {
              const el = document.getElementById(sectionIds[key]);
              if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.add('ring-2', 'ring-red-400', 'ring-offset-2');
                setTimeout(() => el.classList.remove('ring-2', 'ring-red-400', 'ring-offset-2'), 3000);
              }
              break;
            }
          }
          return;
        }

        const garagemEmpresaTexto = utilizacao === "Lazer + trabalho" ? "\n\n" + String.fromCodePoint(0x1F3E2) + " *Possui garagem na empresa:*\n" + garagemEmpresa : "";
        const cepTrabalhoTexto = (utilizacao === "Lazer + trabalho" && garagemEmpresa === "Sim" && enderecoTrabalho) ? "\n\n" + String.fromCodePoint(0x1F4CD) + " *Endereço do trabalho:*\n" + enderecoTrabalho + "\n*CEP trabalho:* " + cepTrabalho : "";
        const enderecoCompleto = endereco + (numero ? ", Nº " + numero : "") + (complemento ? " - " + complemento : "");
        const pin = String.fromCodePoint(0x1F4CD);
        const mail = String.fromCodePoint(0x1F4EE);
        const car = String.fromCodePoint(0x1F697);
        const house = String.fromCodePoint(0x1F3E0);
        const check = String.fromCodePoint(0x2705);
        const phone = String.fromCodePoint(0x1F4F1);
        const mensagem = check + " *Nova cotação recebida!*\n\n" + phone + " *WhatsApp do cliente:*\n" + telefoneCliente + "\n\n" + pin + " *Endereço:*\n" + enderecoCompleto + "\n\n" + mail + " *CEP:*\n" + cep + "\n\n" + car + " *Utilização do veículo:*\n" + utilizacao + "\n\n" + house + " *Possui garagem em casa:*\n" + garagem + garagemEmpresaTexto + cepTrabalhoTexto;

        // Enviar via API do WhatsApp (proxy HTTPS)
        setUploading(true);
        try {
          const headers = { 'Content-Type': 'application/json' };
          const numeroCliente = telefoneCliente.replace(/\D/g, "");
          const star = String.fromCodePoint(0x2B50);
          const confirmacao = star + " *AreaSeguros - Cotação recebida!*\n\nOlá! Recebemos sua solicitação de cotação. Confira os dados enviados:\n\n" + pin + " *Endereço:* " + enderecoCompleto + "\n" + mail + " *CEP:* " + cep + "\n" + car + " *Utilização:* " + utilizacao + "\n" + house + " *Garagem em casa:* " + garagem + (garagemEmpresa ? "\n" + String.fromCodePoint(0x1F3E2) + " *Garagem empresa:* " + garagemEmpresa : "") + "\n\nSe estiver tudo correto, aguarde que um consultor entrará em contato em breve.\n\nSe algo estiver errado, basta responder esta mensagem.\n\n_AreaSeguros - Proteção para o que realmente importa!_";

          // Envia tudo em paralelo pra ser mais rápido
          const promises = [];

          // Pra corretora: texto + fotos
          promises.push(fetch(WHATSAPP_API_URL, { method: 'POST', headers, body: JSON.stringify({ number: WHATSAPP_NUMBER, message: mensagem }) }));
          if (docUrl) promises.push(fetch(WHATSAPP_API_URL, { method: 'POST', headers, body: JSON.stringify({ number: WHATSAPP_NUMBER, image: docUrl, caption: "Documento do cliente" }) }));
          if (cnhUrl) promises.push(fetch(WHATSAPP_API_URL, { method: 'POST', headers, body: JSON.stringify({ number: WHATSAPP_NUMBER, image: cnhUrl, caption: "CNH do cliente" }) }));

          // Pro cliente: fotos + confirmação
          if (docUrl) promises.push(fetch(WHATSAPP_API_URL, { method: 'POST', headers, body: JSON.stringify({ number: numeroCliente, image: docUrl, caption: "Seu documento enviado" }) }));
